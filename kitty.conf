# kitty-configs
#
# A compact Kitty configuration for macOS with:
# - a minimal native title bar
# - 75% background opacity
# - inactive-pane dimming through custom shaders
# - a splits-first layout
# - macOS-style text editing shortcuts
#
# Tested with Kitty 0.50.0 on macOS.
# Reload with: kitten @ load-config
# Or restart Kitty after changing window decorations.

# ---------------------------------------------------------------------------
# Window and appearance
# ---------------------------------------------------------------------------

font_size 13
remember_window_size no
initial_window_width 110c
initial_window_height 30c

background_opacity 0.75
dynamic_background_opacity yes

# Keep the native macOS title bar so the window can be moved, minimized,
# zoomed, and closed. Hide its title and color it like the terminal background.
hide_window_decorations no
macos_titlebar_color background
macos_show_window_title_in menubar
macos_window_resizable yes

# Keep Option's native macOS behavior so layout characters typed with Option
# still work, for example @ (Option+2) and # (Option+3) on Latin American and
# Spanish layouts. Kitty always treats Option as Alt for its own shortcuts, so
# the Option text-editing mappings below still work. Restart Kitty to apply.
# Trade-off: programs in Kitty do not get Alt from Option (for example, Zsh
# Alt+.). Use "left" to keep left Option as Alt and right Option for characters.
macos_option_as_alt no

# ---------------------------------------------------------------------------
# Layout and pane borders
# ---------------------------------------------------------------------------

# Splits is the startup layout. split_axis=horizontal is required for the
# "before" location used by the spl alias to place a pane on the left.
enabled_layouts splits:split_axis=horizontal,fat,grid,horizontal,stack,tall,vertical

# ---------------------------------------------------------------------------
# Tab bar
# ---------------------------------------------------------------------------

# Slant style at the bottom, with a compact dark palette.
tab_bar_style slant
tab_bar_edge bottom
tab_bar_min_tabs 2
tab_bar_align start
tab_bar_background #1a1a1a
active_tab_background #3a3a3a
inactive_tab_background #202020
active_tab_foreground #f2f2f2
inactive_tab_foreground #8a8a8a
active_tab_font_style bold
inactive_tab_font_style normal

active_border_color #ffffff
inactive_border_color #ffffff
window_border_width 0.5pt
draw_minimal_borders yes

# Dim inactive panes to 55% brightness and 75% saturation.
inactive_text_alpha 1.0
custom_shaders dim-inactive-windows

# ---------------------------------------------------------------------------
# Shell integration and local remote control
# ---------------------------------------------------------------------------

shell_integration enabled

# The sp, spr, and spl shell helpers use Kitty remote control. Restricting it
# to a local socket avoids exposing control over the terminal to the network.
allow_remote_control socket-only
listen_on unix:/tmp/kitty

# ---------------------------------------------------------------------------
# Text editing
# ---------------------------------------------------------------------------

map alt+left send_text all \x1bb
map alt+right send_text all \x1bf
map cmd+left send_text all \x01
map cmd+right send_text all \x05
map alt+backspace send_text all \x17
map alt+delete send_text all \x1bd
map cmd+backspace send_text all \x15
map cmd+z send_text all \x1f
map cmd+shift+z send_text all \x18\x1f

# ---------------------------------------------------------------------------
# Font size
# ---------------------------------------------------------------------------

map cmd+plus change_font_size all +1.0
map cmd+equal change_font_size all +1.0
map cmd+minus change_font_size all -1.0
map cmd+0 change_font_size all 0

# ---------------------------------------------------------------------------
# Tabs
# ---------------------------------------------------------------------------

map cmd+alt+left previous_tab
map cmd+alt+right next_tab
map cmd+shift+left move_tab_backward
map cmd+shift+right move_tab_forward

# ---------------------------------------------------------------------------
# Pane navigation
# ---------------------------------------------------------------------------
# These reproduce WezTerm's default pane-focus shortcuts.

map ctrl+shift+left neighboring_window left
map ctrl+shift+right neighboring_window right
map ctrl+shift+up neighboring_window up
map ctrl+shift+down neighboring_window down
